name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege permissions; no secrets are required by either job.
permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hospital360/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./hospital360
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        working-directory: ./hospital360
        run: python -m ruff check .

      - name: Run pytest
        working-directory: ./hospital360
        run: python -m pytest -q

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    # Only run when the Next.js app has been added to the repository.
    if: hashFiles('hospital360/web/package.json') != ''
    defaults:
      run:
        working-directory: ./hospital360/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hospital360/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
