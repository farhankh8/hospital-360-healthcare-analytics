name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - generate, lint & tests
    runs-on: ubuntu-latest
    env:
      H360_SEED: "42"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate synthetic data and build DuckDB
        run: |
          python -m generator.generate
          python -m etl.pipeline

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run pytest (fail on skipped DB-dependent tests)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee pytest.out
          if grep -Eq '(^|[ ,])[1-9][0-9]* skipped' pytest.out; then
            echo "ERROR: skipped tests detected; DB/data may be missing on clean runner"
            exit 1
          fi

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest.out
          if-no-files-found: ignore

  frontend:
    name: Frontend - lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e:
    name: E2E - Playwright
    runs-on: ubuntu-latest
    env:
      H360_SEED: "42"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Generate synthetic data and build DuckDB
        run: |
          python -m generator.generate
          python -m etl.pipeline

      - name: Build web
        working-directory: ./web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ./web
        run: npx playwright install chromium --with-deps

      - name: Start API and web
        shell: bash
        run: |
          set -e
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          cd web
          npm run start -- -p 3000 -H 127.0.0.1 > ../web.log 2>&1 &
          echo $! > ../web.pid
          cd ..
          api_ready=0; web_ready=0
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then api_ready=1; break; fi; sleep 2; done
          for i in {1..60}; do if curl -fsS http://127.0.0.1:3000 >/dev/null; then web_ready=1; break; fi; sleep 2; done
          if [ "$api_ready" != "1" ] || [ "$web_ready" != "1" ]; then echo "Servers failed to start"; tail -n 200 uvicorn.log web.log || true; exit 1; fi

      - name: Run Playwright
        working-directory: ./web
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/e2e/playwright-report
          if-no-files-found: ignore

  docker:
    name: Docker - build, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (timed)
        shell: bash
        run: |
          set -e
          start=$(date +%s)
          docker compose build
          end=$(date +%s)
          echo "BUILD_SECONDS=$((end-start))"
          echo "Total build time: $((end-start))s"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Start stack
        shell: bash
        run: |
          set -e
          docker compose up -d
          api_ready=0; web_ready=0
          for i in {1..90}; do if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then api_ready=1; break; fi; sleep 2; done
          for i in {1..90}; do if curl -fsS http://127.0.0.1:3000 >/dev/null; then web_ready=1; break; fi; sleep 2; done
          if [ "$api_ready" != "1" ] || [ "$web_ready" != "1" ]; then docker compose logs --tail=300 > docker.log 2>&1 || true; tail -n 200 docker.log || true; exit 1; fi

      - name: Smoke checks
        shell: bash
        run: |
          set -e
          {
            curl -fsS http://127.0.0.1:8000/api/v1/health
            echo
            curl -fsS http://127.0.0.1:8000/api/v1/hospitals | head -c 500
            echo
            curl -fsS http://127.0.0.1:3000 >/dev/null
            echo "WEB_OK"
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          } 2>&1 | tee docker-smoke.out

      - name: Collect docker logs on failure
        if: failure()
        shell: bash
        run: docker compose logs --tail=400 > docker.log 2>&1 || true

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            docker.log
            docker-smoke.out
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        shell: bash
        run: docker compose down -v
