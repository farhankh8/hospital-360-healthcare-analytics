services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hospital360-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_PATH: /app/data
      DATABASE_PATH: /app/data/hospital360.duckdb
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      APP_ENV: docker
      LOG_LEVEL: INFO
    # Optional: mount host data to override baked-in image data or persist local runs.
    # volumes:
    #   - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: hospital360-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
