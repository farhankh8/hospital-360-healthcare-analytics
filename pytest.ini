[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    integration: tests that require the generated dataset / DuckDB database
    generator: synthetic-data generator tests
    silver: silver-layer transformation tests
    gold: gold-layer / analytical model tests
    kpi: KPI definition and edge-case tests
    api: FastAPI endpoint tests
filterwarnings =
    ignore::DeprecationWarning:pandas.*
